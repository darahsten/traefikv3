global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: DEBUG

accessLog:
  filePath: /var/log/traefik/access.log
  bufferingSize: 100

api:
  dashboard: true # Optional can be disabled
  insecure: false # Optional can be disabled
  debug: false # Optional can be Enabled if needed for troubleshooting

entryPoints:
  insecure:
    address: ":80"
    # Optional if you want to redirect all HTTP to HTTPS
    http:
      redirections:
        entryPoint:
          to: web
          scheme: https
  web:
    address: ":443"
    http:
      middlewares:
        - secure-headers@file

providers:
  docker:
    watch: true
    network: web # Optional; Only use the "proxy" Docker network, even if containers are on multiple networks.
  file:
    directory: /etc/traefik/dynamic
    watch=true

certificatesResolvers:
  lets-encrypt:
    acme:
      email: darahsten@email.com
      storage: /certs/acme.json
      # caServer: https://acme-v02.api.letsencrypt.org/directory # prod (default)
      # caServer: https://acme-v02.api.letsencrypt.org/directory # staging
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
        delayBeforeCheck: 5
